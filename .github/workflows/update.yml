name: Update job data and deploy

# Two things happen here, and they are deliberately separated:
#   - DEPLOY runs on every push to main and on manual runs -> publishes the
#     current data.json to GitHub Pages. It never changes the data.
#   - REBUILD (scraping) runs ONLY when you trigger it by hand with the
#     "rebuild_data" input set to true. This protects the full 1,787-row
#     data.json: the automated scrape from GitHub's servers is heavily
#     rate-limited by HigherEdJobs and would otherwise overwrite it with a
#     much smaller set. Refresh the data locally instead (see README), or
#     run this by hand only when you accept the smaller server-side result.
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      rebuild_data:
        description: "Re-scrape the sources and overwrite data.json (server-side scrape is rate-limited and returns fewer rows)"
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.rebuild_data }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.rebuild_data }}
        run: pip install -r requirements.txt

      - name: Rebuild data.json (manual only)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.rebuild_data }}
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
        run: python build_data.py

      - name: Commit refreshed data (if changed)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.rebuild_data }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git diff --quiet -- data.json; then
            git add data.json
            git commit -m "Auto-update job data ($(date -u +%Y-%m-%d))"
            git push
          else
            echo "No change in data.json."
          fi

      - name: Upload site as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
